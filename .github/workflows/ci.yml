name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studentos
          POSTGRES_PASSWORD: studentos
          POSTGRES_DB: studentos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studentos -d studentos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://studentos:studentos@localhost:5432/studentos
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-test-access-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      GEMINI_API_KEY: ci-test-gemini-key
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (every workspace)
        run: npm run lint

      - name: Typecheck (every workspace)
        run: npm run typecheck

      - name: Apply database migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy

      - name: Backend tests
        working-directory: apps/backend
        run: npm test

      - name: Frontend tests
        working-directory: apps/frontend
        run: npm test --if-present

      - name: Production builds (shared, backend, frontend)
        run: npm run build
